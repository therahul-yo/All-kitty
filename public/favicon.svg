<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <!-- Solid accent tile: a filled mark holds together at 16px far better
         than an outline, and reads on both light and dark tab strips. -->
    <rect width="32" height="32" rx="7.5" fill="#f2a65a"/>

    <!-- cat head knocked out of the tile -->
    <path fill="#0f1216" d="M5.6 17.2V11.4a1 1 0 0 1 1.8-.6l3.3 4.6h10.6l3.3-4.6a1 1 0 0 1 1.8.6v5.8c0 5.9-4.1 9.4-10.4 9.4S5.6 23.1 5.6 17.2Z"/>

    <!-- eyes + nose punched back through in the accent -->
    <circle cx="11.9" cy="18.2" r="1.85" fill="#f2a65a"/>
    <circle cx="20.1" cy="18.2" r="1.85" fill="#f2a65a"/>
    <rect x="14.4" y="22" width="3.2" height="1.9" rx=".95" fill="#f2a65a"/>
</svg>
